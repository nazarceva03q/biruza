name: Deploy to REG.RU

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Version updated styles and scripts
        run: node scripts/version-assets.cjs

      - name: Check website before publishing
        run: |
          node scripts/check.cjs
          node scripts/check-asset-versions.cjs

      - name: Upload website to REG.RU
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./
          server-dir: / 
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.md
            **/package.json
            **/package-lock.json
            **/server.cjs
